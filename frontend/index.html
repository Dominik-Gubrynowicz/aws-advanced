<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serverless Media Streaming</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --surface-color: rgba(255, 255, 255, 0.05);
      --surface-border: rgba(255, 255, 255, 0.1);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --primary-color: #58a6ff;
      --primary-hover: #1f6feb;
      --success-color: #3fb950;
      --error-color: #f85149;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 1.5rem 0;
      text-align: center;
      background: linear-gradient(180deg, rgba(88, 166, 255, 0.1) 0%, transparent 100%);
      border-bottom: 1px solid var(--surface-border);
      margin-bottom: 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      background: -webkit-linear-gradient(45deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(88, 166, 255, 0.3);
    }

    .main-layout {
      display: flex;
      gap: 2rem;
      width: 100%;
      max-width: 1600px;
      padding: 0 2rem;
      box-sizing: border-box;
      align-items: flex-start;
      margin-bottom: 4rem;
    }

    .left-panel {
      width: 400px;
      flex-shrink: 0;
    }

    .right-panel {
      flex: 1;
      min-width: 0;
      position: sticky;
      top: 6rem;
      /* below header */
    }

    #video-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .video-card {
      background: var(--surface-color);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 1.2rem;
      width: 100%;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .video-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(88, 166, 255, 0.15);
      border-color: rgba(88, 166, 255, 0.5);
    }

    .video-card.active {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 1px var(--primary-color), 0 0 20px rgba(88, 166, 255, 0.2);
      background: rgba(88, 166, 255, 0.05);
    }

    .video-card h3 {
      margin: 0 0 0.8rem 0;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.8rem;
    }

    .status-ready {
      background: rgba(63, 185, 80, 0.1);
      color: var(--success-color);
      border: 1px solid rgba(63, 185, 80, 0.2);
    }

    .status-processing {
      background: rgba(88, 166, 255, 0.1);
      color: var(--primary-color);
      border: 1px solid rgba(88, 166, 255, 0.2);
    }

    .status-failed {
      background: rgba(248, 81, 73, 0.1);
      color: var(--error-color);
      border: 1px solid rgba(248, 81, 73, 0.2);
    }

    .meta-data {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .play-btn {
      display: block;
      width: 100%;
      padding: 0.7rem 0;
      background: var(--primary-color);
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
    }

    .play-btn:active {
      transform: scale(0.97);
    }

    .glass-panel {
      background: var(--surface-color);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      padding: 1.5rem;
    }

    #player-container {
      animation: fadeInZoom 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #player-container h2 {
      margin: 0 0 1rem 0;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--primary-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .empty-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 300px;
      color: var(--text-muted);
    }

    .empty-player h3 {
      margin: 1rem 0 0.5rem 0;
      color: var(--text-main);
    }

    .empty-player p {
      margin: 0;
      font-size: 0.9rem;
    }

    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-muted);
      font-size: 1.2rem;
      width: 100%;
      grid-column: 1 / -1;
    }

    .loading-spinner {
      margin-right: 15px;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(88, 166, 255, 0.3);
      border-radius: 50%;
      border-top-color: var(--primary-color);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeInZoom {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .error-msg {
      color: var(--error-color);
      background: rgba(248, 81, 73, 0.1);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid rgba(248, 81, 73, 0.2);
      text-align: center;
      width: 100%;
      grid-column: 1 / -1;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 4rem 2rem;
      background: var(--surface-color);
      border-radius: 12px;
      border: 1px dashed var(--surface-border);
      width: 100%;
      grid-column: 1 / -1;
    }

    @media (max-width: 1000px) {
      .main-layout {
        flex-direction: column-reverse;
        gap: 2rem;
        padding: 0 1rem;
      }

      .right-panel {
        width: 100%;
        position: static;
      }

      .left-panel {
        width: 100%;
      }

      #video-list {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>
  <header>
    <h1>Video Library</h1>
  </header>

  <div class="main-layout">
    <div class="left-panel">
      <div id="video-list">
        <div class="loader">
          <div class="loading-spinner"></div> Loading library...
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div id="player-placeholder" class="glass-panel empty-player">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.3;">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="10 8 16 12 10 16 10 8"></polygon>
        </svg>
        <h3>No video selected</h3>
        <p>Choose a video from the library to start watching</p>
      </div>

      <div id="player-container" class="glass-panel" style="display:none;">
        <h2 id="now-playing-title">Playing</h2>
        <div class="video-wrapper">
          <video id="video" controls></video>
        </div>
      </div>
    </div>
  </div>

  <script>
    // The API is served under the same CloudFront domain, so we can use a relative path
    const API_URL = "/api";
    let activeVideoId = null;

    function getStatusClass(status) {
      status = status.toLowerCase();
      if (status === 'ready') return 'status-ready';
      if (status === 'failed' || status === 'error') return 'status-failed';
      return 'status-processing';
    }

    function formatDate(dateString) {
      const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      return new Date(dateString).toLocaleDateString(undefined, options);
    }

    async function fetchVideos() {
      try {
        const response = await fetch(`${API_URL}/videos`);
        const videos = await response.json();

        const listDiv = document.getElementById('video-list');
        listDiv.innerHTML = '';

        if (!videos || videos.length === 0) {
          listDiv.innerHTML = `
            <div class="empty-state">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem; opacity: 0.5;">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
              <h3>No videos found</h3>
              <p>Upload a video to your S3 source bucket to get started.</p>
            </div>`;
          return;
        }

        // Sort by created_at descending
        videos.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        videos.forEach(v => {
          const statusClass = getStatusClass(v.status);
          const card = document.createElement('div');
          const isReady = v.status.toLowerCase() === 'ready';
          const titleSafe = (v.title || v.video_id).replace(/'/g, "\\'");
          const vidId = v.video_id;

          card.className = 'video-card';
          card.id = 'video-card-' + vidId;

          card.innerHTML = `
            <div>
              <span class="status-badge ${statusClass}">${v.status}</span>
              <h3>${v.title || v.video_id}</h3>
              <div class="meta-data">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                ${formatDate(v.created_at)}
              </div>
            </div>
            ${isReady ?
              `<button class="play-btn" onclick="playVideo('${v.manifest_url}', '${titleSafe}', '${vidId}')">▶ Play Now</button>` :
              `<button class="play-btn" style="opacity: 0.5; cursor: not-allowed;" disabled>Processing...</button>`}
          `;
          listDiv.appendChild(card);
        });
      } catch (err) {
        document.getElementById('video-list').innerHTML = `
          <div class="error-msg">
            <strong>Error connecting to API</strong><br/>
            ${err.message}
          </div>`;
      }
    }

    function playVideo(manifestUrl, title, vidId) {
      const playerPlaceholder = document.getElementById('player-placeholder');
      const playerContainer = document.getElementById('player-container');
      const video = document.getElementById('video');
      const titleEl = document.getElementById('now-playing-title');

      // Update UI state
      if (activeVideoId) {
        const oldCard = document.getElementById('video-card-' + activeVideoId);
        if (oldCard) oldCard.classList.remove('active');
      }
      activeVideoId = vidId;
      const newCard = document.getElementById('video-card-' + vidId);
      if (newCard) newCard.classList.add('active');

      if (title) {
        titleEl.textContent = title;
      }

      playerPlaceholder.style.display = 'none';
      playerContainer.style.display = 'block';

      // On small screens, scroll to player. On large screens, player is sticky.
      if (window.innerWidth <= 1000) {
        playerContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(manifestUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = manifestUrl;
        video.addEventListener('loadedmetadata', function () {
          video.play();
        });
      }
    }

    // Initialize list
    fetchVideos();
  </script>
</body>

</html>
